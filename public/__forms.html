<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASTONTO Form Processing</title>
</head>
<body>
  <!-- Hidden static HTML form for Netlify build-time form registration -->
  <form name="astonto-contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="astonto-contact" />
    <input type="hidden" name="utm_source" />
    <input type="hidden" name="utm_medium" />
    <input type="hidden" name="utm_campaign" />
    <input type="hidden" name="utm_content" />
    <input type="hidden" name="utm_term" />
    <input type="hidden" name="original_landing_page" />
    <input type="hidden" name="current_landing_page" />
    <input type="hidden" name="referrer" />
    <input type="hidden" name="first_visit_timestamp" />

    <input type="text" name="bot-field" />
    <input type="text" name="fullName" />
    <input type="email" name="workEmail" />
    <input type="text" name="company" />
    <input type="url" name="companyWebsite" />
    <input type="text" name="jobTitle" />
    <input type="text" name="country" />
    <input type="text" name="serviceInterest" />
    <textarea name="mainQuestion"></textarea>
    <input type="tel" name="telephone" />
    <input type="text" name="preferredContact" />
    <input type="checkbox" name="consent" />
  </form>
</body>
</html>
